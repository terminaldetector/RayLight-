name: Publish Abaddon menu and view hotfix

on:
  push:
    branches: ['publish/abaddon-ui-2026-11-22']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abaddon-release-2026-11-22-ui
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'terminaldetector/RayLight-' && github.ref == 'refs/heads/publish/abaddon-ui-2026-11-22'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d9cf3c15e3f9fdeaa1c3e608eaa2a3f21791697d
          path: build-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Package the pinned source and launcher
        run: python3 build-source/DRMD-6DOF/tools/package_windows.py --go go --out "$RUNNER_TEMP/abaddon-release"
      - name: Attach the quick-fix notes and Granada research
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/abaddon-release" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import sys
          folder = Path(sys.argv[1])
          for name in ['ABADDON_QUICKFIX_2026-11-22_RU.md', 'GRANADA_SUPPORT_AI_RESEARCH_RU.md']:
              shutil.copyfile(Path('build-source/DRMD-6DOF') / name, folder / name)
          names = ['Half-Life-Abaddon-Full-Windows.zip', 'AbaddonLauncher.exe',
                   'ABADDON_WINDOWS_LAUNCHER_HANDOFF.md', 'ABADDON_QUICKFIX_2026-11-22_RU.md',
                   'GRANADA_SUPPORT_AI_RESEARCH_RU.md', 'abaddon-build.json']
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          (folder / 'SHA256SUMS.txt').write_text(''.join(digest(folder/name) + '  ' + name + '\n' for name in names))
          names.append('SHA256SUMS.txt')
          assets = {name: [(folder/name).stat().st_size, digest(folder/name)] for name in names}
          (folder / 'release-assets.json').write_text(json.dumps(assets, indent=2))
          print(json.dumps(assets, indent=2))
          PY
      - name: Upload verified files and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/abaddon-2026-11-22/publish_release.py "$RUNNER_TEMP/abaddon-release"
